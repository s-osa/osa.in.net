name: "CI for Pull Request"
on:
  push:
    branches:
      - "*"
      - "*/*"
      - "**"
      - "!master"
jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v3"
      - run: "corepack enable"
      - uses: "actions/setup-node@v3"
        with:
          node-version-file: ".node-version"
          cache: "yarn"
      - run: "yarn install --immutable"
      - run: "yarn build"
